[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: let React Router handle every path (/dashboard, /loans, ...).
# Real files in dist/ are still served first because this rule isn't forced.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, or users get stuck on old builds.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
